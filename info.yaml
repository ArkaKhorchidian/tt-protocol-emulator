# Tiny Tapeout project information
project:
  title:        "Polyglot Protocol Emulator"      # Project title
  author:       "Arka Khorchidian"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Three cycle-exact bit-banging cores with a hardware line coder (CRC, bit-stuffing, NRZI, Manchester) for UART/SPI/I2C/USB/CAN/Ethernet"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     33333333       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_arkakhorchidian_polyglot"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "pg_core.v"
    - "pg_fifo.v"
    - "pg_fifo_lat.v"
    - "pg_imem.v"
    - "pg_host_spi.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "HOST_SCK"
  ui[1]: "HOST_CS_N"
  ui[2]: "HOST_MOSI"
  ui[3]: "IN11 (phys 11)"
  ui[4]: "IN12 (phys 12)"
  ui[5]: "IN13 (phys 13)"
  ui[6]: "IN14 (phys 14)"
  ui[7]: "IN15 (phys 15)"

  # Outputs
  uo[0]: "HOST_MISO"
  uo[1]: "HOST_IRQ"
  uo[2]: "OUT18 (phys 18)"
  uo[3]: "OUT19 (phys 19)"
  uo[4]: "OUT20 (phys 20)"
  uo[5]: "OUT21 (phys 21)"
  uo[6]: "OUT22 (phys 22)"
  uo[7]: "OUT23 (phys 23)"

  # Bidirectional pins
  uio[0]: "IO0 (phys 0)"
  uio[1]: "IO1 (phys 1)"
  uio[2]: "IO2 (phys 2)"
  uio[3]: "IO3 (phys 3)"
  uio[4]: "IO4 (phys 4)"
  uio[5]: "IO5 (phys 5)"
  uio[6]: "IO6 (phys 6)"
  uio[7]: "IO7 (phys 7)"

# Do not change!
yaml_version: 6
